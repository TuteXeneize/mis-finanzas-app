name: FinanzasApp
options:
  bundleIdPrefix: com.matias.finanzas

targets:
  FinanzasApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
      - Models
      - Services
      - Views
      - Helpers
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Mis Finanzas"
        CFBundleIdentifier: "com.matias.finanzas.FinanzasApp"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSSpeechRecognitionUsageDescription: "Permite dictar tus gastos e ingresos por voz para la IA."
        NSMicrophoneUsageDescription: "Permite registrar tus transacciones mediante el micrófono."
    scheme:
      environmentVariables: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matias.finanzas.FinanzasApp
        PRODUCT_NAME: FinanzasApp
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_STYLE: "Manual"
        PROVISIONING_PROFILE_SPECIFIER: ""
        DEVELOPMENT_TEAM: ""

schemes:
  FinanzasApp:
    build:
      targets:
        FinanzasApp: all
