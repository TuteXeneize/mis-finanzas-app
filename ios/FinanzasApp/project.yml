name: FinanzasApp
options:
  bundleIdPrefix: com.matias.finanzas
  deploymentTarget:
    iOS: 17.0
  xcodeVersion: '15.0'

settings:
  base:
    PRODUCT_NAME: FinanzasApp
    DEVELOPMENT_TEAM: "" # Tu Team ID de Apple ID gratuito
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0

targets:
  FinanzasApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
      - path: Helpers
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: "Mis Finanzas"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
