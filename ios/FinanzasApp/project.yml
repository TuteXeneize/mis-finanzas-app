name: FinanzasApp
options:
  bundleIdPrefix: com.matias.finanzas

targets:
  FinanzasApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
      - Models
      - Services
      - Views
      - Helpers
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.matias.finanzas.FinanzasApp
      INFOPLIST_KEY_CFBundleDisplayName: "Mis Finanzas"
      INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
      INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: "YES"
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGN_IDENTITY: ""
      DEVELOPMENT_TEAM: ""
