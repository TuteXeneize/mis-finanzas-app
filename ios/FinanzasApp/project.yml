name: FinanzasApp
options:
  bundleIdPrefix: com.matias.finanzas

targets:
  FinanzasApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
      - Models
      - Services
      - Views
      - Helpers
    scheme:
      environmentVariables: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.matias.finanzas.FinanzasApp
      PRODUCT_NAME: FinanzasApp
      INFOPLIST_KEY_CFBundleDisplayName: "Mis Finanzas"
      INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
      INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: "YES"
      GENERATE_INFOPLIST_FILE: "YES"
      ASSETCATALOG_COMPILER_APPICON_NAME: ""
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGN_IDENTITY: ""
      CODE_SIGN_STYLE: "Manual"

schemes:
  FinanzasApp:
    build:
      targets:
        FinanzasApp: all
