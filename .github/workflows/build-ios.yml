name: Compilar App Nativa iOS (.IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar IPA de FinanzasApp
    runs-on: macos-14

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar Proyecto de Xcode
        run: |
          cd ios/FinanzasApp
          xcodegen generate

      - name: Compilar App (.app)
        run: |
          cd ios/FinanzasApp
          xcodebuild \
            -project FinanzasApp.xcodeproj \
            -scheme FinanzasApp \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR="$(pwd)/build" \
            clean build

      - name: Empaquetar en archivo .IPA
        run: |
          cd ios/FinanzasApp
          APP_PATH=$(find build -name "FinanzasApp.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "FinanzasApp.app" -type d | head -n 1)
          fi
          echo "Ruta de la app encontrada: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r FinanzasApp.ipa Payload
          echo "IPA generado con éxito!"

      - name: Subir instalador IPA como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FinanzasApp-Instalador-iOS
          path: ios/FinanzasApp/FinanzasApp.ipa
          retention-days: 30
