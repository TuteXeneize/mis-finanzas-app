name: Compilar App Nativa iOS (.IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar IPA de FinanzasApp
    runs-on: macos-14

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar Proyecto de Xcode
        run: |
          cd ios/FinanzasApp
          xcodegen generate

      - name: Compilar App (.app)
        run: |
          cd ios/FinanzasApp
          set +e
          xcodebuild \
            -project FinanzasApp.xcodeproj \
            -scheme FinanzasApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build > build.log 2>&1
          
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "### ❌ Detalle del Error de Compilación" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "error:|fatal error:" build.log | head -n 30 >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            tail -n 40 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build.log
            exit $EXIT_CODE
          fi

      - name: Empaquetar en archivo .IPA
        run: |
          cd ios/FinanzasApp
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "FinanzasApp.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "FinanzasApp.app" -type d | head -n 1)
          fi
          echo "App encontrada en: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r FinanzasApp.ipa Payload
          echo "IPA generado con éxito!"

      - name: Subir instalador IPA como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FinanzasApp-Instalador-iOS
          path: ios/FinanzasApp/FinanzasApp.ipa
          retention-days: 30
