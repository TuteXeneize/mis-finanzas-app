name: Compilar App Nativa iOS (.IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar IPA de FinanzasApp
    runs-on: macos-14

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Seleccionar Versión de Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar Proyecto de Xcode
        run: |
          cd ios/FinanzasApp
          xcodegen generate

      - name: Compilar y Generar Archive (.xcarchive)
        run: |
          cd ios/FinanzasApp
          xcodebuild archive \
            -project FinanzasApp.xcodeproj \
            -scheme FinanzasApp \
            -destination 'generic/platform=iOS' \
            -archivePath "$(pwd)/build/FinanzasApp.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" 2>&1 | tee build.log

      - name: Empaquetar archivo .IPA
        run: |
          cd ios/FinanzasApp
          mkdir -p Payload
          cp -R "build/FinanzasApp.xcarchive/Products/Applications/FinanzasApp.app" Payload/
          zip -r -q FinanzasApp.ipa Payload
          echo "IPA generado con éxito!"

      - name: Subir instalador IPA como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FinanzasApp-Instalador-iOS
          path: ios/FinanzasApp/FinanzasApp.ipa
          retention-days: 30
