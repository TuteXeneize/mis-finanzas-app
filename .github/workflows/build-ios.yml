name: Compilar App Nativa iOS (.IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar IPA de FinanzasApp
    runs-on: macos-14

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Seleccionar Versión de Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar Proyecto de Xcode
        run: |
          cd ios/FinanzasApp
          xcodegen generate

      - name: Compilar App (.app)
        run: |
          cd ios/FinanzasApp
          xcodebuild build \
            -project FinanzasApp.xcodeproj \
            -scheme FinanzasApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            BUILD_DIR="$(pwd)/build" 2>&1 | tee build.log

      - name: Subir Log de Compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: ios/FinanzasApp/build.log

      - name: Empaquetar en archivo .IPA
        run: |
          cd ios/FinanzasApp
          APP_PATH=$(find build -name "FinanzasApp.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "FinanzasApp.app" -type d | head -n 1)
          fi
          echo "App encontrada en: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r FinanzasApp.ipa Payload
          echo "IPA generado con éxito!"

      - name: Subir instalador IPA como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FinanzasApp-Instalador-iOS
          path: ios/FinanzasApp/FinanzasApp.ipa
          retention-days: 30
