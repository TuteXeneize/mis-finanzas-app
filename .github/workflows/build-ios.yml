name: Compilar App Nativa iOS (.IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar IPA de FinanzasApp
    runs-on: macos-15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar Proyecto con XcodeGen
        run: |
          cd ios/FinanzasApp
          xcodegen generate

      - name: Compilar Binario con xcodebuild
        run: |
          cd ios/FinanzasApp
          set -o pipefail
          xcodebuild build \
            -project FinanzasApp.xcodeproj \
            -scheme FinanzasApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            BUILD_DIR="$(pwd)/build" 2>&1 | tee build.log

      - name: Extraer y Reportar Errores
        if: failure()
        run: |
          cd ios/FinanzasApp
          echo "### ❌ Primeros errores encontrados:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -C 3 -i "error:" build.log | head -n 40 >> $GITHUB_STEP_SUMMARY || tail -n 40 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Empaquetar archivo .IPA
        if: success()
        run: |
          cd ios/FinanzasApp
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          
          echo "App encontrada en: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No se encontró archivo .app"
            exit 1
          fi
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q FinanzasApp.ipa Payload
          echo "IPA generado exitosamente!"

      - name: Subir instalador IPA como Artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FinanzasApp-Instalador-iOS
          path: ios/FinanzasApp/FinanzasApp.ipa
          retention-days: 30
